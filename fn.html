;resize:vertical}.meta{margin:9px 0;color:#334155;font-weight:800;line-height:1.55}.status-row{display:flex;gap:14px;flex-wrap:wrap;font-weight:900;margin:10px 0}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}.photo{position:relative;background:#0f172a;border-radius:13px;overflow:hidden;border:3px solid var(--red);min-height:155px}.fixed .photo{border-color:var(--green)}.photo img{width:100%;height:190px;display:block;object-fit:contain;cursor:zoom-in}.photo .x{position:absolute;right:5px;top:5px;width:30px;height:30px;border:0;border-radius:50%;background:#111;color:#fff;font-size:21px;font-weight:900;z-index:2}.photo .zoom{color:#fff;text-align:center;font-size:11px;font-weight:900;padding:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.new{margin:13px 0;background:#eff6ff;border:3px dashed #2563eb;border-radius:16px;padding:14px}.new textarea{min-height:240px;background:#fee2e2;border-color:#ef4444;color:#991b1b;font-weight:900;font-size:21px;line-height:1.55;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;border:2px dashed #cbd5e1;border-radius:14px;padding:25px;color:var(--muted);font-weight:800}.viewer{position:fixed;inset:0;z-index:999;background:rgba(2,8,23,.95);display:none;align-items:center;justify-content:center;padding:12px}.viewer.open{display:flex}.viewer img{max-width:98vw;max-height:88vh;width:auto;height:auto;object-fit:contain}.viewer button{position:absolute;right:12px;top:12px;width:48px;height:48px;border:0;border-radius:50%;background:#ef4444;color:#fff;font-size:29px;font-weight:900}.viewer div{position:absolute;bottom:12px;left:12px;right:12px;color:#fff;text-align:center;font-weight:900;font-size:13px}.back{display:inline-flex;margin-top:10px;text-decoration:none;color:var(--blue);font-weight:900}@media(max-width:650px){.head h1{font-size:23px}.grid2{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,mi <body>
<div class="top"><div class="brand"><div><b>PATROLISTT • FINDING CENTRAL</b><small>CENTRAL FINDING NOTES</small></div></div></div>
<div class="wrap">
<div class="head"><h1><i class="fas fa-clipboard-check"></i> FINDING NOTES CENTRAL</h1><p>HALAMAN KHUSUS TEMUAN LAPANGAN. FOTO DITAMPILKAN BESAR DAN DISIMPAN KE BACKEND GOOGLE APPS SCRIPT + GOOGLE DRIVE.</p><div class="tools"><button class="btn primary" id="addBtn">➕ TAMBAH FINDING</button><button class="btn ghost" id="syncBtn">↻ SYNC CENTRAL</button><button class="btn ghost" onclick="location.href='stt.html'">← KEMBALI PATROLI</button></div></div>
<div id="apiState" class="status" style="text-align:center"></div>

</div>

<script>
const GAS_API_ENDPOINTS=[
  "https://script.google.com/macros/s/AKfycbx444U3NRZZ6uMAQAsroavrGUF3a_wp7XwreNWlf5EwXZiMJtKnlELfOwu9UbRJFyn4GA/exec"
],CREATED_BY="Mbah Pri";
let API=GAS_API_ENDPOINTS[0],findings=[];const $=id=>document.getElementById(id);


const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setState(t,ok=false){const el=$('apiState');if(el){el.textContent=t;el.style.color=ok?'#059669':'#64748b';}}
function dateFmt(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'})}
function timeFmt(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}

/* ============================================================
   [FIX #1] jsonGet — TANPA custom header (hindari preflight OPTIONS)
   Custom header seperti Cache-Control/Pragma/Expires memicu preflight
   OPTIONS yang DITOLAK Apps Script → "Failed to fetch" di HP Android.
   Solusi: kirim header minimal, andalkan query param nonce untuk cache-busting.
   Plus 5x retry dengan backoff untuk koneksi 4G lapangan yang sering drop.
   ============================================================ */
async function jsonGet(action, params={}){
  if(!API) throw Error('URL GAS belum diisi.');
  const nonce = Date.now() + '_' + Math.random().toString(36).slice(2, 12);
  const q = new URLSearchParams({ action, ...params, t: nonce, _: nonce, v: '18' });
  let lastErr;
  for(let attempt = 0; attempt < 5; attempt++){
    try{
      const r = await fetch(API + '?' + q.toString(), {
        cache: 'no-store',
        mode: 'cors',
        credentials: 'omit',
        headers: { 'Accept': 'application/json' }
      });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(j.status !== 'success' && j.status !== 'pending')
        throw Error(j.message || 'Central error');
      return j;
    }catch(e){
      lastErr = e;
      // Jangan retry kalau errornya dari server (bukan network)
      if(/INVALID|NOT_FOUND|REQUIRED/i.test(String(e.message))) throw e;
      if(attempt < 4) await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
    }
  }
  throw Error(/json/i.test(String(lastErr && lastErr.message))
    ? 'Central sibuk (limit Google sesaat), coba lagi.'
    : (lastErr && lastErr.message) || 'Central error');
}

function postForm(data,timeoutMs){return new Promise((res,rej)=>{
  if(!API)return rej(Error('URL GAS belum diisi di source finding-notes.html.'));
  const id='if_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const iframe=document.createElement('iframe');iframe.name=id;iframe.style.display='none';
  const f=document.createElement('form');f.method='POST';f.action=API;f.target=id;f.style.display='none';
  for(const [k,v] of Object.entries(data)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v??'');f.appendChild(i)}
  let done=false;const finish=e=>{if(done)return;done=true;clearTimeout(t);iframe.remove();f.remove();e?rej(e):res(true)};
  const t=setTimeout(()=>finish(Error('POST timeout — koneksi terlalu lambat')),timeoutMs||90000);
  iframe.onload=()=>setTimeout(()=>finish(),500);iframe.onerror=()=>finish(Error('POST gagal'));
  document.body.append(iframe,f);try{f.submit()}catch(e){finish(e)}
})}
function fileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',').pop());r.onerror=()=>rej(Error('Foto gagal dibaca'));r.readAsDataURL(file)})}
// Kompres & resize foto di browser SEBELUM diubah ke base64.
// [FIX] maxDim diturunkan 1600→1280, quality 0.72→0.65 → foto 80-150KB
// supaya upload lebih tahan koneksi 4G yang sering drop.
function compressImage(file,maxDim,quality){
  return new Promise((resolve)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>{URL.revokeObjectURL(url);resolve(b?new File([b],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}):file)},'image/jpeg',quality||0.65);
      }catch(_){URL.revokeObjectURL(url);resolve(file)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(file)};
    img.src=url;
  });
}

/* ============================================================
   [FIX #2] upload — 3x retry + polling 500ms + tahan error polling
   Polling GET_UPLOAD_STATUS kalau gagal (Failed to fetch) jangan
   langsung throw — tetap polling karena upload mungkin masih jalan
   di server (form POST sudah terkirim).
   ============================================================ */
async function upload(file,id){
  if(file.size>25*1024*1024)throw Error('Foto maksimal 25 MB.');
  let toSend=file;
  if(file.type.startsWith('image/')){
    try{toSend=await compressImage(file,1280,0.65);}catch(_){toSend=file;}
  }
  const base64=await fileData(toSend);
  for(let retry=0;retry<3;retry++){
    try{
      const j=await postJson({action:'UPLOAD_PHOTO_BASE64',finding_id:id,mime:toSend.type||'image/jpeg',filename:toSend.name,data_base64:base64});
      if(j&&j.url)return j.url;
      if(j&&j.photo&&j.photo.url)return j.photo.url;
      throw Error('Upload foto gagal: URL tidak ditemukan di respons.');
    }catch(e){
      if(retry===2)throw e;
      console.warn('[UPLOAD RETRY '+(retry+1)+'/3]',e.message);
      await new Promise(r=>setTimeout(r,3000));
    }
  }
}

function viewer(src,meta){$('viewerImg').src=src;$('viewerMeta').textContent=meta;$('viewer').classList.add('open')}
function closeV(){$('viewer').classList.remove('open');$('viewerImg').src=''}
$('closeViewer').onclick=closeV;$('viewer').onclick=e=>{if(e.target.id==='viewer')closeV()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeV()});
function statusLabel(s){const v=String(s||'OPEN').toUpperCase();return v==='IN PROGRESS'?'IN PROGRESS':v==='FIXED'?'FIXED':'OPEN'}
function statusClass(s){const v=statusLabel(s);return v==='FIXED'?'fixed':v==='IN PROGRESS'?'progress':'open'}
function photoUrl(p){return String(p||'').trim()}
function card(f){
  const status=statusLabel(f.status), ps=Array.isArray(f.photo_url)?f.photo_url:[];
  return `<article class="finding ${statusClass(status)}" data-id="${esc(f.finding_id)}">
    <div class="finding-head"><div><h3>FINDING NOTES</h3><strong>${esc(f.finding_id)}</strong></div><span class="badge ${statusClass(status)}">${esc(status)}</span></div>
    <div class="meta"><b>AREA:</b> ${esc(f.area_code||'-')}<br><b>PENEMU:</b> ${esc(f.finder_name||'-')}<br><b>TANGGAL:</b> ${esc(dateFmt(f.created_at))} &nbsp; <b>JAM:</b> ${esc(timeFmt(f.created_at))}</div>
    <div class="desc-view">${esc(f.description||'').replace(/\n/g,'<br>')}</div>
    <div class="status-row"><b>STATUS:</b>
      <label><input type="radio" name="s-${esc(f.finding_id)}" data-status="${esc(f.finding_id)}" value="OPEN" ${status==='OPEN'?'checked':''}> OPEN</label>
      <label><input type="radio" name="s-${esc(f.finding_id)}" data-status="${esc(f.finding_id)}" value="IN PROGRESS" ${status==='IN PROGRESS'?'checked':''}> IN PROGRESS</label>
      <label><input type="radio" name="s-${esc(f.finding_id)}" data-status="${esc(f.finding_id)}" value="FIXED" ${status==='FIXED'?'checked':''}> FIXED</label>
    </div>
    <div class="photos">${ps.length?ps.map((p,i)=>`<div class="photo"><button class="x" data-remove="${esc(f.finding_id)}" data-index="${i}" title="Hapus foto">×</button><img loading="lazy" src="${esc(photoUrl(p))}" data-open="${esc(photoUrl(p))}" data-meta="${esc((f.area_code||'')+' • '+(f.finding_id||''))}" onerror="this.closest('.photo').classList.add('broken')"><div class="zoom">🔍 TAP UNTUK LIHAT FOTO BESAR</div></div>`).join(''):'<div class="empty photo-empty">BELUM ADA FOTO FINDING.</div>'}</div>
    <div class="actions">
      <button class="btn primary" data-edit="${esc(f.finding_id)}">✏️ EDIT</button>
      <button class="btn danger" data-delete="${esc(f.finding_id)}">🗑 HAPUS</button>
      <button class="btn warn" data-gallery="${esc(f.finding_id)}">🖼 TAMBAH FOTO</button>
      <button class="btn danger" data-camera="${esc(f.finding_id)}">📷 KAMERA</button>
      <button class="btn ghost" data-save="${esc(f.finding_id)}" style="display:none">💾 SIMPAN PERUBAHAN</button>
      <button class="btn ghost" data-cancel="${esc(f.finding_id)}" style="display:none">BATAL EDIT</button>
      <input type="file" accept="image/*" multiple data-input="${esc(f.finding_id)}" style="display:none">
    </div>
  </article>`;
}
function render(){
  const root=$('root');
  if(!findings.length){root.innerHTML='<div class="empty">BELUM ADA FINDING NOTES DI CENTRAL.</div>';return}
  const groups={};findings.forEach(f=>(groups[f.area_code||'AREA TIDAK DIISI']??=[]).push(f));
  root.innerHTML=Object.entries(groups).map(([area,items])=>`<section class="group"><div class="group-title"><h2>📍 ${esc(area)}</h2><span class="count">${items.length} FINDING</span><button class="btn primary" data-add-area="${esc(area)}">➕ TAMBAH</button></div>${items.map(card).join('')}</section>`).join('');
  wire();
}
function editFinding(id,on=true){
  const el=document.querySelector('.finding[data-id="'+CSS.escape(id)+'"]');if(!el)return;
  const f=findings.find(x=>String(x.finding_id)===String(id));if(!f)return;
  if(on){
    el.classList.add('editing');
    const d=el.querySelector('.desc-view');d.outerHTML=`<textarea class="edit" data-editor="${esc(id)}">${esc(f.description||'')}</textarea>`;
    el.querySelector('[data-edit]').style.display='none';el.querySelector('[data-save]').style.display='inline-block';el.querySelector('[data-cancel]').style.display='inline-block';
  }else{render();}
}
async function saveFinding(id){
  const el=document.querySelector('.finding[data-id="'+CSS.escape(id)+'"]');const f=findings.find(x=>String(x.finding_id)===String(id));if(!f||!el)return;
  const ed=el.querySelector('[data-editor]');if(ed)f.description=ed.value;
  f.status=el.querySelector('[data-status="'+CSS.escape(id)+'"]:checked')?.value||f.status;
  try{setState('⏳ MENYIMPAN...',false);await saveObject(f);await sync()}catch(e){alert('❌ '+e.message)}
}
async function postJson(data){
  if(!API)throw Error('URL GAS belum diisi di source finding-notes.html.');
  let lastErr;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const r=await fetch(API,{
        method:'POST',
        mode:'cors',
        credentials:'omit',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body:new URLSearchParams(data).toString()
      });
      const j=await r.json();
      if(!j||(j.status!=='success'&&j.ok!==true))throw Error((j&&(j.message||j.error))||'Gagal menyimpan ke Central.');
      return j;
    }catch(e){
      lastErr=e;
      if(attempt<2)await new Promise(r=>setTimeout(r,1000*(attempt+1)));
    }
  }
  throw Error(/json/i.test(String(lastErr&&lastErr.message))?'Central sedang sibuk (limit Google sesaat), coba SIMPAN lagi.':(lastErr&&lastErr.message)||'Gagal menyimpan ke Central.');
}
async function saveObject(f){await postJson({action:'SAVE_FINDING',finding_id:f.finding_id,area_code:f.area_code,photo_url:JSON.stringify(f.photo_url||[]),description:f.description||'',finder_name:f.finder_name||'Petugas',created_at:f.created_at,status:f.status||'OPEN'})}
async function delFinding(id){if(!confirm('HAPUS FINDING INI DARI CENTRAL? FOTO DI GOOGLE DRIVE TIDAK DIHAPUS OTOMATIS.'))return;try{setState('⏳ MENGHAPUS...',false);await postJson({action:'DELETE_FINDING',finding_id:id});await sync()}catch(e){alert('❌ '+e.message)}}
async function removePhoto(id,index){const f=findings.find(x=>String(x.finding_id)===String(id));if(!f||!confirm('HAPUS FOTO INI DARI DATA FINDING? FILE DI DRIVE TETAP ADA.'))return;f.photo_url.splice(index,1);try{await saveObject(f);await sync()}catch(e){alert('❌ '+e.message)}}
function wire(){
  document.querySelectorAll('[data-add-area]').forEach(b=>b.onclick=()=>openNew(b.dataset.addArea));
  document.querySelectorAll('[data-open]').forEach(i=>i.onclick=()=>viewer(i.dataset.open,i.dataset.meta));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editFinding(b.dataset.edit,true));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>editFinding(b.dataset.cancel,false));
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveFinding(b.dataset.save));
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>delFinding(b.dataset.delete));
  document.querySelectorAll('[data-status]').forEach(r=>r.onchange=()=>saveFinding(r.dataset.status));
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removePhoto(b.dataset.remove,+b.dataset.index));
  document.querySelectorAll('[data-gallery],[data-camera]').forEach(b=>b.onclick=()=>document.querySelector('[data-input="'+CSS.escape(b.dataset.gallery||b.dataset.camera)+'"]').click());
  document.querySelectorAll('[data-input]').forEach(i=>i.onchange=async e=>{try{const f=findings.find(x=>String(x.finding_id)===String(i.dataset.input));for(const file of Array.from(e.target.files||[])){const url=await upload(file,f.finding_id);f.photo_url.push(url)}await saveObject(f);await sync()}catch(err){alert('❌ '+err.message)}finally{i.value=''}});
}
function openNew(area=''){
  const box=$('newBox'),now=new Date();
  box.innerHTML=`<div class="new"><b style="font-size:18px;color:#1e3a8a">➕ TAMBAH FINDING KE CENTRAL</b><input id="nArea" value="${esc(area)}" placeholder="AREA / AREA CODE" style="margin-top:10px"><input id="nFinder" value="" placeholder="NAMA PENEMU" style="margin-top:9px"><div class="grid2" style="margin-top:9px"><input id="nDate" type="date" value="${new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10)}"><input id="nTime" type="time" step="1" value="${now.toTimeString().slice(0,8)}"></div><textarea id="nDesc" placeholder="TULIS FINDING NOTES SECARA SPESIFIK: LOKASI, KONDISI, OBJEK, DAN TINDAKAN AWAL YANG DILAKUKAN." style="margin-top:9px"></textarea><div id="nPhotos" class="photos"></div><div class="actions"><button class="btn danger" id="nCam">📷 KAMERA</button><button class="btn warn" id="nGal">🖼 GALERI</button><button class="btn primary" id="nSave">☁️ SIMPAN KE CENTRAL</button><button class="btn ghost" id="nCancel">BATAL</button></div><input id="nInput" type="file" accept="image/*" capture="environment" multiple style="display:none"></div>`;
  const files=[],input=$('nInput');
  const show=()=>{$('nPhotos').innerHTML=files.map((f,i)=>`<div class="photo"><img src="${URL.createObjectURL(f)}"><button class="x" data-i="${i}">×</button></div>`).join('');$('nPhotos').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);show()})};
  $('nCam').onclick=()=>input.click();$('nGal').onclick=()=>{input.removeAttribute('capture');input.click()};input.onchange=()=>{files.push(...Array.from(input.files||[]).filter(f=>f.type.startsWith('image/')));show();input.value=''};
  $('nCancel').onclick=()=>box.innerHTML='';
  $('nSave').onclick=async()=>{const ar=$('nArea').value.trim(),desc=$('nDesc').value.trim();if(!ar||!desc)return alert('AREA dan FINDING NOTES wajib diisi.');const id='FIND-'+Date.now()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();const f={finding_id:id,area_code:ar,finder_name:$('nFinder').value.trim()||'Petugas',description:desc,photo_url:[],created_at:new Date(`${$('nDate').value}T${$('nTime').value||'00:00:00'}`).toISOString(),status:'OPEN'};const failedPhotos=[];for(const file of files){try{f.photo_url.push(await upload(file,id))}catch(e){failedPhotos.push(file.name+': '+e.message)}}try{await saveObject(f);box.innerHTML='';await sync();if(failedPhotos.length)alert('⚠️ FINDING TERSIMPAN, TAPI '+failedPhotos.length+' FOTO GAGAL UPLOAD:\n'+failedPhotos.join('\n'));else alert('✅ FINDING TERSIMPAN DI CENTRAL.')}catch(e){alert('❌ FINDING GAGAL TERSIMPAN: '+e.message+(failedPhotos.length?'\n(Foto yang sempat terupload: '+f.photo_url.length+')':''))}};
  box.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ============================================================
   [FIX #3] readSttCache — TTL 1 jam + normalisasi photo_url
   ============================================================ */
const CACHE_TTL_MS = 1000 * 60 * 60; // 1 jam

function readSttCache(){
  try{
    const raw = localStorage.getItem('STT_FINDING_CENTRAL_CACHE_V16');
    const x = JSON.parse(raw || '{}');
    const list = Array.isArray(x.findings) ? x.findings : [];
    const updatedAt = Number(x.updatedAt || 0);
    const isFresh = updatedAt > 0 && (Date.now() - updatedAt) < CACHE_TTL_MS;
    return {
      findings: list.map(v => ({
        ...v,
        photo_url: (Array.isArray(v?.photo_url) ? v.photo_url : [])
          .map(p => typeof p === 'string' ? p : String(p?.url || ''))
          .filter(p => /^https?:\/\//i.test(p))
      })),
      revision: String(x.revision || ''),
      updatedAt,
      isFresh
    };
  }catch(_){
    return { findings: [], revision: '', updatedAt: 0, isFresh: false };
  }
}

/* ============================================================
   [FIX #4] sync — data server selalu menang; fallback cache HANYA
   kalau fresh (< 1 jam). Cache basi tidak dipakai supaya semua
   device tidak menampilkan data lama yang beda-beda.
   ============================================================ */
async function sync(){
  if(!API){setState('⚠️ CENTRAL BELUM TERHUBUNG — CEK GAS_API_ENDPOINTS DI SOURCE HTML.',false);return}
  try{
    setState('⏳ SINKRONISASI CENTRAL...',false);
    const j=await jsonGet('GET_FINDINGS');
    const serverRev=String(j.revision||'0');
    const remote=Array.isArray(j.data)?j.data.map(x=>({
      ...x,
      photo_url:(Array.isArray(x.photo_url)?x.photo_url:[])
        .map(p=>typeof p==='string'?p:String(p?.url||''))
        .filter(p=>/^https?:\/\//i.test(p))
    })):[];
    findings=remote;
    try{
      localStorage.setItem('STT_FINDING_CENTRAL_CACHE_V16',JSON.stringify({
        findings:remote,
        revision:serverRev,
        updatedAt:Date.now()
      }));
    }catch(_){ }
    render();
    setState('● CENTRAL ONLINE • '+findings.length+' FINDING',true);
    console.log('[SYNC] revision='+serverRev+' findings='+findings.length);
  }catch(e){
    console.error('[SYNC] error:',e);
    const cache=readSttCache();
    if(cache.findings.length && cache.isFresh){
      findings=cache.findings;
      render();
      const ageMin=Math.round((Date.now()-cache.updatedAt)/60000);
      setState('⚠️ CENTRAL OFFLINE • CACHE '+ageMin+' MENIT LALU ('+findings.length+' FINDING)',false);
      return;
    }
    findings=[];
    render();
    setState('⚠️ CENTRAL OFFLINE • '+e.message+' • CACHE SUDAH BASI',false);
  }
}
$('syncBtn').onclick=sync;$('addBtn').onclick=()=>openNew('');sync();

/* ============================================================
   [FIX #5] AUTO-SYNC POLLING — semua device selalu sinkron
   Device lain otomatis update dalam max 25 detik tanpa klik SYNC.
   Skip kalau user sedang mengetik / edit / modal terbuka.
   ============================================================ */
(function(){
  const SYNC_INTERVAL = 25000;   // 25 detik
  let syncTimer = null;

  async function autoSync(){
    try{
      if(document.querySelector('.new') || document.querySelector('.finding.editing')) return;
      if(document.querySelector('.viewer.open')) return;
      await sync();
    }catch(e){ /* diamkan */ }
  }

  function schedule(){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      await autoSync();
      schedule();
    }, SYNC_INTERVAL);
  }

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') autoSync();
  });
  window.addEventListener('online', () => autoSync());
  window.addEventListener('focus', () => autoSync());

  schedule();
  console.log('[AUTO-SYNC] aktif setiap ' + (SYNC_INTERVAL/1000) + ' detik');
})();
</script>
